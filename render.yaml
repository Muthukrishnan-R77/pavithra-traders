# Deploy customer + admin as TWO separate Render web services.
# Both share the same PostgreSQL database.
#
# After deploy, set these manually in Render dashboard:
#   pavithra-customer → ADMIN_URL = https://pavithra-admin.onrender.com/admin/login
#   pavithra-admin    → NEXTAUTH_URL = https://pavithra-admin.onrender.com
#   pavithra-admin    → ADMIN_PASSWORD = your secure password

databases:
  - name: pavithra-db
    plan: free
    databaseName: pavithra_traders
    user: pavithra

services:
  - type: web
    name: pavithra-customer
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_MODE
        value: customer
      - key: DATABASE_URL
        fromDatabase:
          name: pavithra-db
          property: connectionString
      - key: ADMIN_URL
        sync: false

  - type: web
    name: pavithra-admin
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /admin/login
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_MODE
        value: admin
      - key: DATABASE_URL
        fromDatabase:
          name: pavithra-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@pavithra.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Shop Owner
