# Optional: deploy the FULL app on Render instead of Vercel.
# Database can also be used by Vercel — copy DATABASE_URL into Vercel env vars.
#
# Deploy: connect this repo on Render → New Blueprint → select render.yaml

databases:
  - name: pavithra-db
    plan: free
    databaseName: pavithra_traders
    user: pavithra

services:
  - type: web
    name: pavithra-traders
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        fromDatabase:
          name: pavithra-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@pavithra.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Shop Owner
