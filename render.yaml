# Two separate Render web services (customer + admin).
# Uses your EXISTING PostgreSQL database — no new DB is created here.
#
# BEFORE applying this Blueprint:
# 1. Render dashboard → your existing database (pavithra-db) → copy External Database URL
#
# AFTER both services are Live, set Environment variables:
#
# pavithra-customer:
#   DATABASE_URL = (paste existing database URL)
#   ADMIN_URL    = https://pavithra-admin.onrender.com/admin/login
#
# pavithra-admin:
#   DATABASE_URL     = (same database URL)
#   NEXTAUTH_URL     = https://pavithra-admin.onrender.com
#   ADMIN_PASSWORD   = your secure password

services:
  - type: web
    name: pavithra-customer
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_MODE
        value: customer
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_URL
        sync: false

  - type: web
    name: pavithra-admin
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /admin/login
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_MODE
        value: admin
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@pavithra.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Shop Owner
