services:
  postgres:
    image: postgres:16-alpine
    container_name: pavithra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pavithra_traders
    ports:
      - "5432:5432"
    volumes:
      - pavithra_pg_data:/var/lib/postgresql/data

volumes:
  pavithra_pg_data:
